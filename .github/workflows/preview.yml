# PR → static preview on S3 + CloudFront. See deploy/README.md ("PR previews").
name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1
  PREVIEW_BUCKET: asymmetric-research-squads-verifier-previews
  TELEPORT_VERSION: 18.8.3
  TELEPORT_PROXY: asymmetricresearch.teleport.sh:443
  # Do not name this TELEPORT_BOT_TOKEN: tbot binds that env var to its --token flag,
  # which wipes the join_method from the config generated by teleport-actions/auth
  TELEPORT_JOIN_TOKEN: github-action-squads-verifier-preview-bot

jobs:
  preview:
    name: Build & Publish Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Teleport Machine ID github join
      pull-requests: write # preview URL comment
    # Fork PRs get no id-token, so they cannot join Teleport. Previews are for branch PRs only.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - name: Compute preview path
        id: path
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "prefix=pr-${PR_NUMBER}/${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
      # The build is path-relative (no paths.base — see svelte.config.js), so
      # the same output works under any bucket prefix. Previews have no nginx,
      # so only the <meta> CSP applies.
      - name: Build static preview
        env:
          RPC_URL: ${{ vars.RPC_URL }}
        run: bun run build
      - name: Install Teleport binaries
        uses: teleport-actions/setup@b638ff596557cc3959eb6b5287d5e58e0c8ac6a6 # v1.1.1
        with:
          version: ${{ env.TELEPORT_VERSION }}
          enterprise: true
      - name: Auth to Teleport using Machine ID
        id: auth
        uses: teleport-actions/auth@3b365df2b4f64891358392a444ff34929ba0d0b1 # v2.1.2
        with:
          proxy: ${{ env.TELEPORT_PROXY }}
          token: ${{ env.TELEPORT_JOIN_TOKEN }}
          certificate-ttl: 15m
          # allow-reissue lets tsh apps login issue app (AWS) certs from bot identity
          allow-reissue: true
          disable-env-vars: true
      - name: Create tsh profile from Machine ID identity
        env:
          IDENTITY_FILE: ${{ steps.auth.outputs.identity-file }}
        run: tsh -i "$IDENTITY_FILE" --proxy "$TELEPORT_PROXY" login
      - name: Login to AWS via Teleport
        run: |
          tsh apps login aws-integration-ops-prod --aws-role squads-verifier-preview-ci
      - name: Upload to preview bucket
        env:
          PREFIX: ${{ steps.path.outputs.prefix }}
        run: |
          tsh aws s3 sync build/ "s3://${PREVIEW_BUCKET}/${PREFIX}/" --delete --no-progress
          # Bucket-root housekeeping: keep previews out of search indexes and
          # give the S3 website error document something to serve.
          printf 'User-agent: *\nDisallow: /\n' | tsh aws s3 cp - "s3://${PREVIEW_BUCKET}/robots.txt" --content-type text/plain
          printf '<!doctype html><h1>Preview not found</h1><p>This preview may have expired.</p>' | tsh aws s3 cp - "s3://${PREVIEW_BUCKET}/404.html" --content-type text/html
      - name: Comment preview URL on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREFIX: ${{ steps.path.outputs.prefix }}
          # Set the PREVIEW_HOST repo variable to the CloudFront domain once
          # the distribution exists (see deploy/README.md); until then the
          # comment falls back to the HTTP S3 website endpoint.
          PREVIEW_HOST: ${{ vars.PREVIEW_HOST }}
        with:
          script: |
            const prefix = process.env.PREFIX
            const url = process.env.PREVIEW_HOST
              ? `https://${process.env.PREVIEW_HOST}/${prefix}/`
              : `http://asymmetric-research-squads-verifier-previews.s3-website-eu-west-1.amazonaws.com/${prefix}/`
            const marker = '<!-- squads-verifier-preview -->'
            const body = `${marker}\n**Preview:** ${url}\n\nBuilt from ${context.payload.pull_request.head.sha}. Each push gets a fresh URL; every preview stays live for 30 days after its upload, even after newer pushes or the PR closing. It talks to Solana mainnet: approving or rejecting here signs real transactions.`
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find((c) => c.body?.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })
            }
