# main → image per merge. Same shape as dotcom's publish-main.yml, with
# env-neutral tags: the tag names the commit (`main-<sha>` / `<sha>`)
# or the branch tip (`main`), never an environment — which environment runs
# an image is decided by the deploy config, not the artifact name.
#
# Every merge to main builds and pushes ghcr.io/asymmetric-research/squads.asymmetric.re;
# argocd-image-updater (see the squads-verifier-staging Application in
# config-management) picks up the new main-<sha> tag and rolls the staging
# deployment, which serves only behind Teleport. Production ships from
# vX.Y.Z tags instead (publish-semver.yml).
name: Publish Main Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Staging only wants the newest commit; drop superseded in-flight builds so
# the mutable `main` tag can't end up pointing at a stale build.
concurrency:
  group: publish-main
  cancel-in-progress: true

permissions: {}

jobs:
  publish:
    name: Build & Publish Main Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # sign the provenance attestation
      attestations: write # store the provenance attestation
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=main-
            type=sha,prefix=
            type=raw,value=main
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          # See the Dockerfile: baked into the bundle and the CSP.
          build-args: RPC_URL=${{ vars.RPC_URL }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
