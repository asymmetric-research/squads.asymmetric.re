apiVersion: v1
kind: Service
metadata:
  name: squads-verifier-staging
  namespace: squads-verifier
  labels:
    app.kubernetes.io/name: squads-verifier-staging
    # Teleport kube-agent app discovery (config-management ops-staging
    # teleport-integration helm-values.yaml) exposes this service as the
    # `squads-verifier-staging` Teleport app — same pattern as dotcom.
    asymmetricresearch.teleport.sh/app-discovery: "true"
    # Grants app access to the all-employees Teleport role.
    role: all-employees
  annotations:
    teleport.dev/name: squads-verifier-staging
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: squads-verifier-staging
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
