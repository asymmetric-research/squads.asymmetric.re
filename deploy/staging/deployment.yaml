apiVersion: apps/v1
kind: Deployment
metadata:
  name: squads-verifier-staging
  namespace: squads-verifier
  labels:
    app.kubernetes.io/name: squads-verifier-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: squads-verifier-staging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: squads-verifier-staging
    spec:
      imagePullSecrets:
        - name: ghcr-puller
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: squads-verifier
          # argocd-image-updater overrides this to the newest main-<sha> tag;
          # `main` is the fallback so a fresh sync deploys something sensible
          # before the updater's first run.
          image: ghcr.io/asymmetric-research/squads.asymmetric.re:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
