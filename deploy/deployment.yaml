apiVersion: apps/v1
kind: Deployment
metadata:
  name: squads-verifier
  namespace: squads-verifier
  labels:
    app.kubernetes.io/name: squads-verifier
spec:
  replicas: 2
  # Deployment selectors are immutable; this one predates the move from
  # config-management, so it keeps app.kubernetes.io/name rather than `app`.
  selector:
    matchLabels:
      app.kubernetes.io/name: squads-verifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: squads-verifier
    spec:
      imagePullSecrets:
        - name: ghcr-puller
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: squads-verifier
          # argocd-image-updater overrides this to the newest vX.Y.Z build.
          image: ghcr.io/asymmetric-research/squads.asymmetric.re:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
